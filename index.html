<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2ea" />
    <meta name="description" content="Portfolio of Ayoub Ayed, computer science student and software developer." />
    <title>Ayoub Ayed — Computer Science Student</title>
    <script>
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search.slice(1).split('&').map(function (part) {
            return part.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null,
            null,
            '/portfolio/' + decoded + location.hash
          );
        }
      })(window.location);
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark' ? stored :
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
