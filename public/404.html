<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      var segmentCount = 1;
      var location = window.location;
      location.replace(
        location.protocol +
        '//' +
        location.hostname +
        (location.port ? ':' + location.port : '') +
        '/portfolio/' +
        '?/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body></body>
</html>
